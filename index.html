<script>
    let googleReviewClicked = false;

    function handleGoogleClick() {
      googleReviewClicked = true;
      document.getElementById('googleDoneText').style.display = 'block';
      
      const instaCard = document.getElementById('instaCard');
      if (instaCard) {
        instaCard.classList.remove('locked');
      }
    }

    // Detect return to tab
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden && googleReviewClicked) {
        showInstagramPrompt();
      }
    });

    window.addEventListener('pageshow', function() {
      if (googleReviewClicked) {
        showInstagramPrompt();
      }
    });

    function showInstagramPrompt() {
      const instaCard = document.getElementById('instaCard');
      if (instaCard) {
        instaCard.classList.remove('locked');
        instaCard.classList.add('active-pulse');
        instaCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    // Reliable cross-platform copy & app launcher
    function copyAndOpenInsta() {
      const text = document.getElementById("captionText").innerText.trim();
      const toast = document.getElementById("toast");

      // 1. Copy to clipboard (handles modern and fallback methods)
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text);
      } else {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.left = "-999999px";
        textarea.style.top = "-999999px";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try {
          document.execCommand('copy');
        } catch (err) {}
        document.body.removeChild(textarea);
      }

      // Show the copied badge
      if (toast) {
        toast.style.display = "block";
      }

      // 2. Open Instagram immediately (No setTimeout to avoid browser security block)
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;

      if (/android/i.test(userAgent)) {
        // Native Android Intent: launches app directly; falls back to web if not installed
        window.location.href = "intent://instagram.com/#Intent;package=com.instagram.android;scheme=https;end";
      } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        // iOS URL scheme
        window.location.href = "instagram://app";
        // Fallback for iOS if app is missing
        setTimeout(function() {
          window.location.href = "https://www.instagram.com/";
        }, 1500);
      } else {
        // Desktop / Laptop
        window.open("https://www.instagram.com/", "_blank");
      }
    }
  </script>
